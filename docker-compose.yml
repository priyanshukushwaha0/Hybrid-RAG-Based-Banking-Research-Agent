services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: banking-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:6333/healthz || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: banking-rag-api
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    depends_on:
      qdrant:
        condition: service_healthy

  streamlit:
    build: .
    container_name: banking-rag-streamlit
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - api

volumes:
  qdrant_data:
